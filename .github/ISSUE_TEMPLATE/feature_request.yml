name: "💡 Feature Request"
description: Suggest an idea, new workshop topic, or tool enhancement.
title: "[FEATURE]: <short idea summary>"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for a new module, starter kit, or project feature? Let us know below!
  - type: textarea
    id: feature-summary
    attributes:
      label: Proposed Feature / Topic
      description: What would you like to see added or built?
      placeholder: E.g., Add a starter kit showing how to fine-tune a vision transformer with PyTorch.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation / Use Case
      description: Why would this be helpful for chapter members or projects?
      placeholder: E.g., Many 2nd-year students are exploring transfer learning for their term projects.
    validations:
      required: true
  - type: textarea
    id: implementation-ideas
    attributes:
      label: Possible Implementation / Alternatives (Optional)
      description: Any specific libraries, notebooks, or architectures in mind?
      placeholder: E.g., We could use torchvision.models or Hugging Face transformers.
    validations:
      required: false
